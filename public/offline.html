<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3fa968">
  <title>Tumbuh · Sedang offline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #f2faf5; color: #1f3d2b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 1.35rem; margin: 1.25rem 0 .5rem; }
    p { color: #4b6355; line-height: 1.5; margin: 0 0 1.5rem; }
    button { border: 0; border-radius: .75rem; background: #3fa968; color: #fff; font-weight: 600;
             font-size: 1rem; padding: .8rem 1.5rem; cursor: pointer; }
    button:hover { background: #2f8a53; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>Kamu sedang offline</h1>
    <p>Tumbuh butuh internet untuk mencatat gelas dan menyimpan XP. Tetap minum ya, lalu catat begitu sinyal kembali.</p>
    <button type="button" onclick="location.reload()">Coba lagi</button>
  </main>
</body>
</html>
